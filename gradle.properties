org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP1 (the default) calls a Kotlin Gradle Plugin incremental-compilation API
# (KotlinCompile$ClasspathSnapshotProperties.getUseClasspathSnapshot()) that
# was removed from the Kotlin 2.1.x KGP shape, causing a NoSuchMethodError
# when creating kspDebugKotlin tasks. KSP2 doesn't use that legacy code path.
ksp.useKSP2=true
